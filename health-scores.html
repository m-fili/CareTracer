<!doctype html>
<html lang="en">
<head>
<script src="auth.js"></script>
<script>window.CareTracerAuth && window.CareTracerAuth.require("patient");</script>
<meta charset="utf-8" />
<title>CareTracer - Your Health Scores</title>
<meta name="viewport" content="width=1440" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  /* ===== Complete styles ===== */
  :root {
    --teal: #0E5C6F;
    --teal-soft: #B3D9DF;
    --warm-white: #FBFAF7;
    --surface: #FFFFFF;
    --surface-alt: #F4F6F8;
    --border: #E5EAEE;
    --text: #1B2330;
    --text-2: #6B7785;
    --good: #6FA88D;
    --caution: #D49A4E;
    --alert: #C56B72;
    --track-cog: #4F90B8;
    --track-gly: #E8985F;
    --track-cv:  #D55D5D;
    --track-kid: #8B7BB8;
    --panel-bg: #F8F9FB;

    --card-shadow: 0 1px 2px rgba(27,35,48,0.04), 0 2px 4px rgba(27,35,48,0.04);
    --card-pad: 24px;
    --card-radius: 12px;
    --row-gap: 20px;
    --page-pad-x: 32px;
    --page-pad-y: 24px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--warm-white);
    color: var(--text);
    font: 400 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "tnum";
  }
  a { color: var(--teal); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .shell {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
    max-width: 1440px;
    margin: 0 auto;
  }

  .sidebar {
    background: var(--surface-alt);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .wordmark {
    padding: 24px 24px 28px;
    color: var(--teal);
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wordmark .mark { width: 22px; height: 22px; flex: none; }
  .nav { display: flex; flex-direction: column; padding: 0 12px; gap: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 12px;
    height: 44px; padding: 0 12px;
    color: var(--text);
    font-size: 16px;
    border-radius: 6px;
    position: relative;
  }
  .nav a:hover { background: rgba(179, 217, 223, 0.25); text-decoration: none; }
  .nav a svg { width: 16px; height: 16px; color: var(--text-2); flex: none; }
  .nav a.is-selected {
    background: rgba(179, 217, 223, 0.30);
    color: var(--teal);
    font-weight: 500;
  }
  .nav a.is-selected svg { color: var(--teal); }
  .nav a.is-selected::before {
    content: "";
    position: absolute; left: -12px; top: 8px; bottom: 8px;
    width: 3px; background: var(--teal); border-radius: 0 2px 2px 0;
  }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 64px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--page-pad-x);
  }
  .topbar h1 { margin: 0; font-size: 20px; font-weight: 600; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 24px; }
  .last-updated { font-size: 14px; color: var(--text-2); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--teal); color: #fff;
    font-size: 14px; font-weight: 600;
    display: grid; place-items: center;
    letter-spacing: 0.02em;
  }

  .content {
    padding: var(--page-pad-y) var(--page-pad-x);
    display: flex;
    flex-direction: column;
    gap: var(--row-gap);
  }
  .page-header h2 {
    margin: 0 0 6px;
    font-size: 28px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em;
  }
  .page-header p.subhead {
    margin: 0;
    font-size: 16px;
    color: var(--text-2);
    max-width: 880px;
  }
  .page-header p.sample {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--text-2);
    font-style: italic;
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }
  .panel + .panel { margin-top: 12px; }
  .panel-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-2);
    margin: 0 0 6px;
  }
  .panel-title {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .panel-sub {
    margin: 0 0 24px;
    font-size: 14px;
    color: var(--text-2);
    max-width: 720px;
  }
  .panel-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  .score-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .score-label-row {
    display: inline-flex;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-2);
    gap: 2px;
  }
  .score-help {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    margin-left: 6px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    cursor: help;
    padding: 0;
    vertical-align: middle;
  }
  .score-help:hover {
    background: var(--surface-alt);
    color: var(--text);
    border-color: var(--text-2);
  }
  .help-hit {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    margin-left: -7px;
    border-radius: 50%;
    background: transparent;
    border: 0;
    padding: 0;
    cursor: help;
  }
  .detail-link {
    font-size: 13px;
    font-weight: 500;
    color: var(--teal);
    white-space: nowrap;
  }

  .score-num-row {
    margin-top: 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .score-num {
    font-size: 32px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .score-units-inline {
    font-size: 12px;
    color: var(--text-2);
    font-weight: 400;
  }
  .score-trend {
    font-size: 18px;
    line-height: 1;
    font-weight: 700;
  }
  .trend-good    { color: var(--good); }
  .trend-caution { color: var(--caution); }
  .trend-stable  { color: var(--text-2); }

  .score-units-secondary {
    font-size: 12px;
    color: var(--text-2);
    margin: 2px 0 0;
  }

  .score-status {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--text);
  }

  .chart-wrap {
    margin-top: 16px;
    width: 100%;
    height: 150px;
    position: relative;
  }
  .chart-wrap canvas {
    width: 100% !important;
    height: 100% !important;
  }

  .card-footer {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--text-2);
    flex-wrap: wrap;
  }
  .card-footer .right { text-align: right; }

  .companion-cta {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
  }
  .companion-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(179, 217, 223, 0.30);
    display: grid; place-items: center;
    flex: none;
  }
  .companion-text {
    flex: 1 1 auto;
    display: flex; flex-direction: column; gap: 2px;
  }
  .companion-text strong { font-size: 15px; font-weight: 600; color: var(--text); }
  .companion-text span { font-size: 13px; color: var(--text-2); }
  .btn-primary {
    background: var(--teal); color: #fff;
    border: 1px solid var(--teal);
    font-size: 14px; font-weight: 600;
    padding: 10px 20px; border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    flex: none;
  }
  .btn-primary:hover { background: #0a4c5c; }

  /* Loading styles */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-2);
    font-size: 16px;
  }
  .loading .spinner {
    display: inline-block;
    width: 30px;
    height: 30px;
    border: 3px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .error-msg {
    background: #fee2e2;
    color: #991b1b;
    padding: 16px 20px;
    border-radius: 12px;
    margin: 20px 0;
    border: 1px solid #fecaca;
  }
</style>
</head>
<body>

<script>

  const TEST_CONFIG = {
    "HbA1c": {
      label: "HbA1c",
      unit: "%",
      color: "#E8985F",
      ranges: { normal: [0, 5.6], warning: [5.7, 6.4], danger: [6.5, Infinity] },
      statusTexts: {
        "Normal": "Normal range",
        "Warning": "Prediabetes range",
        "Needs Attention": "Diabetes range"
      },
      searchKeys: ["hba1c", "hemoglobin a1c"]
    },
    "eGFR": {
      label: "eGFR",
      unit: "mL/min/1.73 m²",
      color: "#8B7BB8",
      ranges: { normal: [90, Infinity], warning: [60, 89], danger: [0, 59] },
      statusTexts: {
        "Normal": "Normal kidney function",
        "Warning": "CKD Stage G2 · mildly decreased",
        "Needs Attention": "CKD Stage G3+ · significantly decreased"
      },
      searchKeys: ["egfr", "estimated gfr", "gfr"]
    },
    "LDL Cholesterol": {
      label: "LDL Cholesterol",
      unit: "mg/dL",
      color: "#D55D5D",
      ranges: { normal: [0, 100], warning: [101, 160], danger: [161, Infinity] },
      statusTexts: {
        "Normal": "Optimal · within normal range",
        "Warning": "Borderline high",
        "Needs Attention": "High"
      },
      searchKeys: ["ldl", "ldl cholesterol"]
    },
    "Blood Pressure": {
      label: "Blood Pressure",
      unit: "mmHg",
      color: "#4F90B8",
      ranges: { normal: [0, 120], warning: [121, 139], danger: [140, Infinity] },
      statusTexts: {
        "Normal": "Normal",
        "Warning": "Elevated",
        "Needs Attention": "High"
      },
      searchKeys: ["blood pressure", "bp"]
    },
    "Heart Rate": {
      label: "Heart Rate",
      unit: "bpm",
      color: "#6FA88D",
      ranges: { normal: [60, 100], warning: [50, 59], danger: [0, 49] },
      statusTexts: {
        "Normal": "Normal resting heart rate",
        "Warning": "Low resting heart rate",
        "Needs Attention": "Very low heart rate"
      },
      searchKeys: ["heart rate", "hr", "pulse"]
    },
    "BMI": {
      label: "BMI",
      unit: "kg/m²",
      color: "#D49A4E",
      ranges: { normal: [18.5, 25], warning: [25, 30], danger: [30, Infinity] },
      statusTexts: {
        "Normal": "Normal weight",
        "Warning": "Overweight",
        "Needs Attention": "Obese"
      },
      searchKeys: ["bmi"]
    }
  };


  function getStatusInfo(testName, value) {
    const config = TEST_CONFIG[testName];
    if (!config) return { text: "Unknown", className: "warning", color: "var(--text-2)" };
    
    const ranges = config.ranges;
    if (value >= ranges.normal[0] && value <= ranges.normal[1]) {
      return { text: "Normal", className: "normal", color: "var(--good)" };
    }
    if (value >= ranges.warning[0] && value <= ranges.warning[1]) {
      return { text: "Warning", className: "warning", color: "var(--caution)" };
    }
    return { text: "Needs Attention", className: "danger", color: "var(--alert)" };
  }

  function getStatusText(testName, value) {
    const config = TEST_CONFIG[testName];
    if (!config) return "Unknown";
    const status = getStatusInfo(testName, value);
    return config.statusTexts[status.text] || status.text;
  }

  function getTrend(points) {
    if (points.length < 2) return { icon: "―", class: "trend-stable" };
    const last = points[points.length - 1].value;
    const prev = points[points.length - 2].value;
    if (last < prev) return { icon: "▼", class: "trend-good" };
    if (last > prev) return { icon: "▲", class: "trend-caution" };
    return { icon: "―", class: "trend-stable" };
  }


  function extractHealthDataFromStore(storeData) {

    const observations = storeData.filter(r => r.resourceType === "Observation");
    const healthData = {};

    for (const [key, config] of Object.entries(TEST_CONFIG)) {
      const points = [];
      
     
      for (const obs of observations) {
        const code = obs.code?.coding?.[0]?.display || obs.code?.coding?.[0]?.code || "";
        const lowerCode = code.toLowerCase();
        

        const matches = config.searchKeys.some(k => lowerCode.includes(k.toLowerCase()));
        if (!matches) continue;
        
        const value = obs.valueQuantity?.value;
        const date = obs.effectiveDateTime || obs.effectiveDate || obs.issued || "";
        
        if (value !== undefined && value !== null && !isNaN(value) && date) {
          points.push({ date: date, value: value });
        }
      }
      
      if (points.length > 0) {

        points.sort((a, b) => new Date(a.date) - new Date(b.date));
        healthData[key] = {
          label: config.label,
          unit: config.unit,
          color: config.color,
          points: points
        };
      }
    }
    
    return healthData;
  }


  function renderCharts(healthData) {
    const container = document.getElementById('dynamicContent');
    const loadingEl = document.getElementById('loadingState');
    const errorEl = document.getElementById('errorState');
    const lastUpdatedEl = document.getElementById('lastUpdated');


    loadingEl.style.display = 'none';
    errorEl.style.display = 'none';
    container.style.display = 'block';


    let latestDate = "Unknown";
    for (const key in healthData) {
      const points = healthData[key].points;
      if (points.length > 0) {
        const lastPoint = points[points.length - 1];
        if (lastPoint.date > latestDate || latestDate === "Unknown") {
          latestDate = lastPoint.date;
        }
      }
    }
    if (latestDate !== "Unknown") {
      const d = new Date(latestDate);
      lastUpdatedEl.textContent = `Last updated ${d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}`;
    }


    let html = `
      <section class="panel" aria-labelledby="panel1-title">
        <p class="panel-eyebrow">Regular scores</p>
        <h3 class="panel-title" id="panel1-title">Your direct measurements</h3>
        <p class="panel-sub">Trended lab values and vital signs taken from your own record.</p>
        <div class="panel-grid">
    `;

    for (const [key, data] of Object.entries(healthData)) {
      const points = data.points;
      if (points.length === 0) continue;

      const lastValue = points[points.length - 1].value;
      const trend = getTrend(points);
      const statusText = getStatusText(key, lastValue);
      const statusColor = getStatusInfo(key, lastValue).color;
      const lastDate = new Date(points[points.length - 1].date);
      const formattedDate = lastDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      html += `
        <article class="card">
          <div class="score-top">
            <span class="score-label-row">
              ${data.label}
              <button class="help-hit" type="button" aria-label="What is ${data.label}?">
                <span class="score-help" aria-hidden="true">?</span>
              </button>
            </span>
            <a class="detail-link" href="#">View detail →</a>
          </div>

          <div class="score-num-row">
            <span class="score-num">${lastValue}</span>
            <span class="score-trend ${trend.class}">${trend.icon}</span>
          </div>
          <p class="score-units-secondary">${data.unit}</p>
          <p class="score-status" style="color:${statusColor};">${statusText}</p>

          <div class="chart-wrap">
            <canvas id="chart-${key.replace(/\s/g, '')}"></canvas>
          </div>

          <div class="card-footer">
            <span>Updated ${formattedDate}</span>
            <span class="right">Source: Lab result</span>
          </div>
        </article>
      `;
    }

    html += `
        </div>
      </section>
      <article class="companion-cta">
        <div class="companion-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#0E5C6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/>
          </svg>
        </div>
        <div class="companion-text">
          <strong>Have a question about your scores?</strong>
          <span>The Companion explains any score, its inputs, its trend, and what it cannot see.</span>
        </div>
        <button class="btn-primary" type="button">Ask the Companion</button>
      </article>
    `;

    container.innerHTML = html;


    setTimeout(() => {
      for (const [key, data] of Object.entries(healthData)) {
        const canvasId = `chart-${key.replace(/\s/g, '')}`;
        const ctx = document.getElementById(canvasId);
        if (!ctx) continue;

        const labels = data.points.map(p => {
          const d = new Date(p.date);
          return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        });
        const values = data.points.map(p => p.value);

        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: data.label,
              data: values,
              borderColor: data.color,
              backgroundColor: data.color + '20',
              fill: true,
              tension: 0.3,
              pointRadius: 4,
              pointBackgroundColor: data.color,
              pointBorderColor: '#fff',
              pointBorderWidth: 2,
              borderWidth: 2.5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return `${context.parsed.y} ${data.unit}`;
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: false,
                grid: { color: 'rgba(0,0,0,0.05)' },
                ticks: { font: { size: 9 } }
              },
              x: {
                grid: { display: false },
                ticks: { font: { size: 9 }, maxTicksLimit: 6 }
              }
            }
          }
        });
      }
    }, 150);
  }

  
  function loadDataFromStore() {
    const loadingEl = document.getElementById('loadingState');
    const errorEl = document.getElementById('errorState');
    const errorMsg = document.getElementById('errorMessage');


    if (!window.CareTracerStore) {
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorMsg.textContent = 'CareTracerStore is not available. Please connect your health records first.';
      return;
    }


    window.CareTracerStore.getResources().then(function(resources) {
      if (!resources || resources.length === 0) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorMsg.textContent = 'No health data found. Please connect your health records first.';
        return;
      }


      const healthData = extractHealthDataFromStore(resources);
      
      if (Object.keys(healthData).length === 0) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorMsg.textContent = 'No matching health scores found in your data. Please check your observations.';
        return;
      }

      // Render
      renderCharts(healthData);
      
    }).catch(function(err) {
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorMsg.textContent = 'Error loading data: ' + err.message;
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    loadDataFromStore();
  });
</script>
</body>
</html>
